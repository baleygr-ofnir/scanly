name: Build and Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  RESOURCE_GROUP: "RG-Jack-Reveny-5e257d-DotNetCloudDeveloper-VT-Mars-Goteborg"
  ACR_NAME: "acrscanlyiqahsyc4gnwrs" # Byt ut detta om ditt ACR-namn ändras
  CONTAINER_APP_NAME: "ca-scanly-api"
  IMAGE_NAME: "scanly/api"

permissions:
  id-token: write # Krävs för OIDC-inloggning mot Azure
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # (Frivilligt) Deploya Infrastrukturen via Bicep varje gång
      # Om du avkommenterar detta måste du lägga till dina hemligheter i GitHub Secrets
      # - name: Deploy Infrastructure (Bicep)
      #   uses: azure/CLI@v2
      #   with:
      #     azcliversion: latest
      #     inlineScript: |
      #       az deployment group create \
      #         --resource-group ${{ env.RESOURCE_GROUP }} \
      #         --template-file ./main.bicep \
      #         --parameters azureDiEndpoint="${{ secrets.AZURE_DI_ENDPOINT }}" azureDiKey="${{ secrets.AZURE_DI_KEY }}"

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ./api
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest ./api

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Update Azure Container App
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
